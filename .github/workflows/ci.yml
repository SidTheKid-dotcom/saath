# Lint, typecheck, test and build on every push and pull request.
# Deploy is opt-in via the repository variable ENABLE_VERCEL_DEPLOY. The value
# true enables a deploy job. Actions compares strings without regard to case,
# so true, TRUE, and True all enable it. Any other value, including unset or
# empty, skips both deploy jobs. The check job does not read that variable or
# any secret.
# With deploy enabled, a pull request gets a preview and a push to main deploys
# production. The Vercel project is not connected to GitHub (production builds
# have been created with the Vercel CLI), so this workflow is the deploy path.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-preview:
    needs: check
    if: vars.ENABLE_VERCEL_DEPLOY == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Require Vercel deploy secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          if [ -z "${VERCEL_TOKEN//[[:space:]]/}" ]; then
            missing="${missing} VERCEL_TOKEN"
          fi
          if [ -z "${VERCEL_ORG_ID//[[:space:]]/}" ]; then
            missing="${missing} VERCEL_ORG_ID"
          fi
          if [ -z "${VERCEL_PROJECT_ID//[[:space:]]/}" ]; then
            missing="${missing} VERCEL_PROJECT_ID"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::ENABLE_VERCEL_DEPLOY is true, but these Actions secrets are missing or empty for this run:${missing}. Fork pull requests do not receive Actions secrets. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID under Settings → Secrets and variables → Actions → Secrets. This step does not print secret values."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    needs: check
    if: vars.ENABLE_VERCEL_DEPLOY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Require Vercel deploy secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          if [ -z "${VERCEL_TOKEN//[[:space:]]/}" ]; then
            missing="${missing} VERCEL_TOKEN"
          fi
          if [ -z "${VERCEL_ORG_ID//[[:space:]]/}" ]; then
            missing="${missing} VERCEL_ORG_ID"
          fi
          if [ -z "${VERCEL_PROJECT_ID//[[:space:]]/}" ]; then
            missing="${missing} VERCEL_PROJECT_ID"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::ENABLE_VERCEL_DEPLOY is true, but these Actions secrets are missing or empty for this run:${missing}. Fork pull requests do not receive Actions secrets. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID under Settings → Secrets and variables → Actions → Secrets. This step does not print secret values."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
